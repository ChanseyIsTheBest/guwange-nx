# Guwange-specific analysis corrections for the code generator (default.xex, with its Title Update #1 patch).
#
# Every entry needs its evidence (which tool or which log found it).

# The CRT's setjmp/longjmp (root keys: they must stay outside any table). Recompiled as plain calls, a longjmp would
# restore r1/r31 from the jmp_buf and then return to its own caller with a foreign stack frame; with the addresses the
# generator emits host setjmp/longjmp keyed by the guest jmp_buf. Found by shape (2026-10-21, futari-nx's pair: the
# same CRT), the only pair in the five binaries (the game cores have none):
#   setjmp  0x823EBB30: optional hook word at 0x82C188C0 (lis r4,0x82C2; lwz r0,-0x7740(r4); bnectr), then mflr, mfcr,
#           stfd f14-f31 at 0(r3), std r13.. at 152(r3)
#   longjmp 0x823EB810: r7 = r3 (mr r7,r3), the SEH registration check at +312 (lwz r0,0x138(r3)), then lfd f14-f31
#           from 0(r7)
setjmp_address = 0x823EBB30
longjmp_address = 0x823EB810

[functions]
# Declared by hand (2026-10-21, the first PC boot: "Call to invalid or unregistered function at guest address
# 0x824F4488"): a comparison callback built at 0x8250D644 (lis/addi), which tools/pointer_fixpoint.py rejected as a
# fragment by mistake: it reads only r3/r4 at entry (lwz r11,0(r3); lwz r9,0(r4)), walks two lists for their largest
# 16-bit field and returns 0, 1 or -1 (subfc/subfe/rlwinm/addi), ending in blr.
"0x824F4488" = { }  # built at 0x8250D644
# A function whose end the discovery cut short (first codegen, 2026-10-21: "Unresolved conditional branch to
# 0x82190CA4 from 0x82190CB0"). sub_82190C50 (called through the pointer at 0x820C2BA8) returns at 0x82190CA8, but
# its blt cr6 at 0x82190C74 goes on to a 4-instruction tail (and. r11,r11,r10; beq 0x82190CA4; li r3,1; blr) that ends
# at 0x82190CBC; split off as sub_82190CAC, the tail's beq back into the function could not be resolved.
"0x82190C50" = { size = 0x6C }

